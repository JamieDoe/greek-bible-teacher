# Production stack for a single VPS. See docs/DEPLOYMENT.md.
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d --build
# Only Caddy is published; web, API and Postgres stay on the internal network.
name: greek-bible-teacher-prod

x-api-image: &api-image
  image: gbt-api:${IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: apps/api/Dockerfile

x-database-env: &database-env
  DATABASE_URL: postgres://${POSTGRES_USER:-greek}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/${POSTGRES_DB:-greek}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-greek}
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off on every deploy: migrations, then the idempotent NT import and curated content.
  # The new API starts only if this succeeds.
  release:
    <<: *api-image
    command: ["node", "--import", "tsx", "src/scripts/release.ts"]
    restart: "no"
    environment:
      <<: *database-env
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      <<: *database-env
      NODE_ENV: production
      API_PORT: "8787"
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in deploy/.env}
    depends_on:
      release:
        condition: service_completed_successfully

  web:
    image: gbt-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8787
    restart: unless-stopped
    environment:
      # Server Components read this at runtime; the /api/* rewrite was fixed at build time.
      API_INTERNAL_URL: http://api:8787
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
